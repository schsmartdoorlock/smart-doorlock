<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>출입 인증 키패드</title>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  query,
  where
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getDatabase,
  ref,
  set
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD8Ze-40qNj-FMDjCu2XSlhdc57oDpUs-M",
  authDomain: "smart-doorlock-ed630.firebaseapp.com",
  projectId: "smart-doorlock-ed630",
  storageBucket: "smart-doorlock-ed630.firebasestorage.app",
  messagingSenderId: "319771642912",
  appId: "1:319771642912:web:18a412384f1792ad2d8045",
  databaseURL: "https://smart-doorlock-ed630-default-rtdb.asia-southeast1.firebasedatabase.app"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const realtimeDb = getDatabase(app);

let currentCode = "";

function updateDisplay() {

  document.getElementById("display").innerText =
    currentCode || "----";
}

function addNumber(num) {

  if (currentCode.length >= 4) return;

  currentCode += num;

  updateDisplay();
}

function clearOne() {

  currentCode =
    currentCode.slice(0, -1);

  updateDisplay();
}

async function openDoorCommand() {

  await set(
    ref(realtimeDb, "commands/door-node-01"),
    {
      command: "OPEN_DOOR",
      status: "pending",
      createdAt: Date.now()
    }
  );
}

async function submitCode() {

  const statusText =
    document.getElementById("status");

  if (currentCode.length !== 4) {

    statusText.innerText =
      "4자리 비밀번호를 입력하세요.";

    return;
  }

  statusText.innerText =
    "인증 확인 중...";

  try {

    const q = query(
      collection(db, "access_codes"),
      where("code", "==", currentCode)
    );

    const snap =
      await getDocs(q);

    if (snap.empty) {

      statusText.innerText =
        "비밀번호가 올바르지 않습니다.";

      currentCode = "";

      updateDisplay();

      return;
    }

    const userData =
      snap.docs[0].data();

    await openDoorCommand();

    statusText.innerText =
      `${userData.name}님 입장 확인되었습니다`;

    currentCode = "";

    updateDisplay();

  } catch (e) {

    console.error(e);

    statusText.innerText =
      "오류가 발생했습니다.";

    currentCode = "";

    updateDisplay();
  }
}

window.addEventListener("DOMContentLoaded", () => {

  updateDisplay();

  document
    .querySelectorAll(".key")
    .forEach(btn => {

      btn.addEventListener("click", () => {

        const value =
          btn.dataset.value;

        if (value === "clear") {

          clearOne();

        } else if (value === "submit") {

          submitCode();

        } else {

          addNumber(value);
        }
      });
    });
});

</script>

<style>

*{
  box-sizing:border-box;
}

html,body{

  margin:0;
  padding:0;

  width:100%;
  height:100%;

  background:#f3f4f6;

  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;
}

body{

  display:flex;

  justify-content:center;

  align-items:center;
}

.wrap{

  width:100%;
  max-width:430px;

  padding:24px;
}

.title{

  text-align:center;

  font-size:34px;

  font-weight:900;

  margin-bottom:24px;

  color:#111827;
}

.keypad-wrap{

  background:white;

  border-radius:32px;

  padding:28px;

  box-shadow:0 12px 32px rgba(0,0,0,0.08);
}

.display{

  width:100%;

  height:90px;

  border-radius:24px;

  background:#071633;

  color:white;

  display:flex;

  justify-content:center;

  align-items:center;

  font-size:52px;

  font-weight:900;

  letter-spacing:10px;

  margin-bottom:18px;
}

.status{

  text-align:center;

  font-size:18px;

  font-weight:700;

  min-height:28px;

  margin-bottom:22px;

  color:#111827;
}

.keypad{

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:16px;
}

.key{

  height:88px;

  border:none;

  border-radius:22px;

  font-size:32px;

  font-weight:800;

  cursor:pointer;

  background:#f3f4f6;

  transition:0.15s;
}

.key:active{

  transform:scale(0.96);
}

.submit{

  background:#071633;

  color:white;
}

.clear{

  background:#ef4444;

  color:white;
}

</style>

</head>

<body>

<div class="wrap">

  <div class="title">
    출입 인증
  </div>

  <div class="keypad-wrap">

    <div class="display" id="display">
      ----
    </div>

    <div class="status" id="status">
      4자리 비밀번호 입력
    </div>

    <div class="keypad">

      <button class="key" data-value="1">1</button>
      <button class="key" data-value="2">2</button>
      <button class="key" data-value="3">3</button>

      <button class="key" data-value="4">4</button>
      <button class="key" data-value="5">5</button>
      <button class="key" data-value="6">6</button>

      <button class="key" data-value="7">7</button>
      <button class="key" data-value="8">8</button>
      <button class="key" data-value="9">9</button>

      <button class="key clear" data-value="clear">←</button>
      <button class="key" data-value="0">0</button>
      <button class="key submit" data-value="submit">확인</button>

    </div>

  </div>

</div>

</body>
</html>
