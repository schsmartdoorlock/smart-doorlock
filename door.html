<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8" />

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<title>출입 인증 키패드</title>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  query,
  where
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyD8Ze-40qNj-FMDjCu2XSlhdc57oDpUs-M",

  authDomain: "smart-doorlock-ed630.firebaseapp.com",

  projectId: "smart-doorlock-ed630",

  storageBucket: "smart-doorlock-ed630.firebasestorage.app",

  messagingSenderId: "319771642912",

  appId: "1:319771642912:web:18a412384f1792ad2d8045"
};

const app =
  initializeApp(firebaseConfig);

const db =
  getFirestore(app);

let currentCode = "";

function updateDisplay(){

  document.getElementById("display").innerText =
    currentCode || "----";
}

function addNumber(num){

  if(currentCode.length >= 4) return;

  currentCode += num;

  updateDisplay();
}

function clearOne(){

  currentCode =
    currentCode.slice(0,-1);

  updateDisplay();
}

async function submitCode(){

  const status =
    document.getElementById("status");

  if(currentCode.length !== 4){

    status.innerText =
      "4자리 비밀번호 입력";

    return;
  }

  status.innerText =
    "인증 확인 중...";

  try{

    const q =
      query(
        collection(db,"access_codes"),
        where("code","==",currentCode)
      );

    const snap =
      await getDocs(q);

    if(snap.empty){

      status.innerText =
        "비밀번호 오류";

      currentCode = "";

      updateDisplay();

      return;
    }

    const userData =
      snap.docs[0].data();

    status.innerText =
      `${userData.name}님 입장 확인되었습니다.`;

    /*
      라즈베리파이 연결 시 여기만 수정

      예시:
      await fetch("http://192.168.0.10:5000/open");
    */

    // await fetch("http://192.168.0.10:5000/open");

    currentCode = "";

    updateDisplay();

  }catch(e){

    console.error(e);

    status.innerText =
      "오류 발생";

    currentCode = "";

    updateDisplay();
  }
}

window.addEventListener("DOMContentLoaded",()=>{

  updateDisplay();

  document
    .querySelectorAll(".key")
    .forEach(btn=>{

      btn.addEventListener("click",()=>{

        const value =
          btn.dataset.value;

        if(value === "clear"){

          clearOne();

        }else if(value === "submit"){

          submitCode();

        }else{

          addNumber(value);
        }
      });
    });
});

</script>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{

  margin:0;

  width:100%;
  height:100vh;

  background:#f3f4f6;

  display:flex;

  justify-content:center;
  align-items:center;

  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Noto Sans KR",
  sans-serif;
}

.wrap{

  width:100%;
  max-width:480px;

  padding:24px;
}

.title{

  text-align:center;

  font-size:42px;

  font-weight:900;

  margin-bottom:28px;

  color:#071633;
}

.display{

  width:100%;

  height:100px;

  background:#071633;

  border-radius:28px;

  display:flex;

  justify-content:center;
  align-items:center;

  color:white;

  font-size:52px;

  font-weight:900;

  letter-spacing:12px;

  margin-bottom:20px;
}

.status{

  text-align:center;

  font-size:20px;

  font-weight:700;

  color:#374151;

  min-height:28px;

  margin-bottom:24px;
}

.keypad{

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:16px;
}

.key{

  height:95px;

  border:none;

  border-radius:24px;

  background:white;

  font-size:36px;

  font-weight:900;

  color:#111827;

  box-shadow:
  0 6px 18px rgba(0,0,0,0.06);

  cursor:pointer;
}

.key:active{

  transform:scale(0.96);
}

.submit{

  background:#071633;

  color:white;
}

.clear{

  background:#ef2222;

  color:white;
}

</style>

</head>

<body>

<div class="wrap">

  <div class="title">
    출입 인증
  </div>

  <div class="display" id="display">
    ----
  </div>

  <div class="status" id="status">
    4자리 비밀번호 입력
  </div>

  <div class="keypad">

    <button class="key" data-value="1">1</button>
    <button class="key" data-value="2">2</button>
    <button class="key" data-value="3">3</button>

    <button class="key" data-value="4">4</button>
    <button class="key" data-value="5">5</button>
    <button class="key" data-value="6">6</button>

    <button class="key" data-value="7">7</button>
    <button class="key" data-value="8">8</button>
    <button class="key" data-value="9">9</button>

    <button class="key clear" data-value="clear">←</button>

    <button class="key" data-value="0">0</button>

    <button class="key submit" data-value="submit">
      확인
    </button>

  </div>

</div>

</body>
</html>
